name: CI

on: 
  pull_request:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/**'

jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Instala node
        uses: actions/setup-node@v4
      
        with:
          node-version: '22'

      - name: Instala dependências
        run: npm install
        
      - name: Roda os testes
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Instala node
        uses: actions/setup-node@v4
      
        with:
          node-version: '22'

      - name: Instala dependências
        run: npm install

      - name: Build
        run: npm run build